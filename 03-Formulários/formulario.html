<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome"><br><br>


        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Seu e-mail"><br><br>

        <label for="numero">Número:</label>
        <input type="number" id="numero" name="numero" placeholder="Seu número"><br><br>

        <label for="estado">Estado</label>
        <select id="estado" name="estado">
            <option value="ro">Rondônia</option>
            <option value="ac">Acre</option>
            <option value="am">Amazonas</option>

        </select><br><br>

        <label for="mensagem">Mensagem:</label>
        <textarea type="text" id="mensagem" name="mensagem" placeholder="Deixe uma mensagem"></textarea><br><br>

        <button type="submit">Enviar</button><br><br>
    </form>
</body>
</html>
